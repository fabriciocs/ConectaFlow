services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_APP_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?required}
    volumes:
      - validation-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  migrate:
    image: wa-akg:validation
    environment: &app-env
      NODE_ENV: production
      PORT: 43000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@db:3306/${MYSQL_DATABASE}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?required}
      WA_AKG_AUTH_STATE_KEY: ${WA_AKG_AUTH_STATE_KEY:?required}
      BASE_URL: ${BASE_URL:?required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?required}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:?required}
      WA_AKG_MCP_ENABLED: "true"
      WA_AKG_TRUSTED_PROXY_HEADERS: "true"
      SOCKET_IO_DISTRIBUTED: "true"
      SOCKET_IO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SOCKET_IO_REDIS_KEY: wa-akg-validation
      ENABLE_TELEMETRY: "false"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: wa-akg:validation
    environment: *app-env
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/start-production.mjs"]
    expose:
      - "43000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:43002:80"
    volumes:
      - ./Caddyfile.validation:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      app:
        condition: service_started
volumes:
  validation-mysql:
